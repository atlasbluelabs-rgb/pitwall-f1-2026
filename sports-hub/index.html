<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090b10"><title>Sports Hub 2026 | Consenso</title>
<style>
:root{color-scheme:dark;--bg:#090b10;--panel:#151b26;--line:#293344;--txt:#f4f7fb;--muted:#9aa6b7;--blue:#4c9aff;--green:#37d69a;--red:#ff6472;--amber:#f4bd55}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font:15px system-ui,-apple-system,Segoe UI,sans-serif}header{position:sticky;top:0;background:#0d1119f2;backdrop-filter:blur(12px);z-index:2;padding:14px;border-bottom:1px solid var(--line)}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.brand{font-size:21px;font-weight:850}.blue{color:var(--blue)}button{border:0;border-radius:12px;padding:10px 13px;background:#202a39;color:#dce8f8;font-weight:700;cursor:pointer}nav,.tabs{display:flex;gap:7px;overflow:auto;padding:12px 0 2px;scrollbar-width:none}nav button,.tabs button{white-space:nowrap;border-radius:20px;font-size:12px;color:var(--muted)}button.active{background:var(--blue);color:white}.tabs{background:#151b26;border-radius:13px;padding:5px}.tabs button{flex:1;background:transparent}.tabs button.active{background:#3a4658}main{max-width:900px;margin:auto;padding:14px}.notice,.card{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:14px;margin:10px 0}.notice{font-size:13px;color:var(--muted)}.ok{color:var(--green)}.err{color:var(--red)}.warn{color:var(--amber)}.small{font-size:11px;color:var(--muted)}.row{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}.match{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;padding:13px 0;border-bottom:1px solid var(--line)}.team:last-child{text-align:right}.score{font-size:20px;font-weight:850}.empty{text-align:center;padding:24px;color:var(--muted)}.pill{display:inline-block;padding:4px 8px;border-radius:9px;background:#263449;color:#cfe2ff;font-size:11px;font-weight:700}.prob{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:12px 0}.prob div{background:#0e1420;padding:10px;border-radius:10px;text-align:center}.prob b{display:block;font-size:20px}.source{font-size:12px;color:var(--muted);padding:5px 0}input{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;background:#0d1420;color:white;margin:5px 0 12px}label{font-size:12px;color:var(--muted)}footer{text-align:center;color:var(--muted);font-size:11px;padding:20px}
</style></head><body>
<header><div class="top"><div><div class="brand">SPORTS HUB <span class="blue">2026</span></div><div class="small">Datos cruzados · Probabilidad · Consenso</div></div><button id="refresh">↻ Actualizar</button></div><nav id="sports"></nav><div class="tabs" id="tabs"><button data-view="games" class="active">Partidos</button><button data-view="consensus">Consenso</button><button data-view="sources">Fuentes y claves</button></div></header>
<main><div id="status" class="notice">Preparando fuentes de datos…</div><div id="updated" class="small"></div><div id="app"></div></main>
<footer>Un pronóstico no garantiza un resultado. Sin dos fuentes independientes y comparables, la app muestra “sin consenso”.</footer>
<script>
const sports={nba:['NBA','basketball_nba','basketball/nba'],nfl:['NFL','americanfootball_nfl','football/nfl'],mlb:['MLB','baseball_mlb','baseball/mlb'],nhl:['NHL','icehockey_nhl','hockey/nhl'],mx:['Liga MX','soccer_mexico_ligamx','soccer/mex.1'],pl:['Premier League','soccer_epl','soccer/eng.1'],laliga:['La Liga','soccer_spain_la_liga','soccer/esp.1'],seriea:['Serie A','soccer_italy_serie_a','soccer/ita.1'],bundes:['Bundesliga','soccer_germany_bundesliga','soccer/ger.1'],ucl:['Champions','soccer_uefa_champs_league','soccer/uefa.champions'],mls:['MLS','soccer_usa_mls','soccer/usa.1'],f1:['Fórmula 1',null,null]};
const $=id=>document.getElementById(id);let sport='nba',view='games',games=[],oddsEvents=[],sportmonksFixtures=[],sessions=[],lastUpdate=null,errors=[];
const getKey=k=>localStorage.getItem(k)||'';const setKey=(k,v)=>localStorage.setItem(k,v);
function status(t,c=''){ $('status').textContent=t;$('status').className='notice '+c }
function nav(){ $('sports').innerHTML=Object.entries(sports).map(([k,v])=>'<button data-s="'+k+'" class="'+(sport===k?'active':'')+'">'+v[0]+'</button>').join('') }
function norm(s){return (s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]/g,'')}
function sameTeams(a,b){let ah=norm(a.home),aa=norm(a.away),bh=norm(b.home),ba=norm(b.away);return (ah===bh||ah.includes(bh)||bh.includes(ah))&&(aa===ba||aa.includes(ba)||ba.includes(aa))}
function smProbability(f){let p=(f.predictions||[]).find(x=>x.type?.developer_name==='FULLTIME_RESULT_PROBABILITY'||x.type?.name==='Fulltime Result Probability');if(!p)return null;let q=p.predictions||{};if(q.home==null||q.draw==null||q.away==null)return null;return {home:+q.home,draw:+q.draw,away:+q.away,source:'Sportmonks'}}
function oddsProbability(e){let sums={home:0,draw:0,away:0},n=0;for(const b of e.bookmakers||[]){let m=(b.markets||[]).find(x=>x.key==='h2h');if(!m)continue;let o=m.outcomes||[],h=o.find(x=>norm(x.name)===norm(e.home_team)),a=o.find(x=>norm(x.name)===norm(e.away_team)),d=o.find(x=>norm(x.name)==='draw');if(!h||!a||!h.price||!a.price)continue;let invH=1/h.price,invA=1/a.price,invD=d?.price?1/d.price:0,total=invH+invA+invD;if(!total)continue;sums.home+=100*invH/total;sums.away+=100*invA/total;if(d)sums.draw+=100*invD/total;n++}if(!n)return null;return {home:sums.home/n,draw:sums.draw/n,away:sums.away/n,source:'Promedio de casas ('+n+')'}}
function consensus(g){let list=[];let od=oddsEvents.find(x=>sameTeams(g,{home:x.home_team,away:x.away_team}));if(od){let p=oddsProbability(od);if(p)list.push(p)}let sm=sportmonksFixtures.find(x=>sameTeams(g,{home:(x.participants||[]).find(y=>y.meta?.location==='home')?.name||x.name?.split(' vs ')[0],away:(x.participants||[]).find(y=>y.meta?.location==='away')?.name||x.name?.split(' vs ')[1]}));if(sm){let p=smProbability(sm);if(p)list.push(p)}
if(list.length<2)return {list,agree:false,reason:'Faltan dos fuentes independientes con probabilidades comparables.'};
let keys=['home','draw','away'];let avg={};keys.forEach(k=>avg[k]=list.reduce((s,p)=>s+(p[k]||0),0)/list.length);let tops=list.map(p=>keys.reduce((a,k)=>p[k]>p[a]?k:a,'home'));let agree=tops.every(x=>x===tops[0]);return {list,avg,agree,top:agree?tops[0]:null,reason:agree?'Las fuentes independientes señalan el mismo resultado.':'Las fuentes discrepan en el resultado más probable.'}}
function outcomeLabel(k){return k==='home'?'Local':k==='away'?'Visitante':'Empate'}
function card(g){let c=consensus(g),football=sport!=='nba'&&sport!=='nfl'&&sport!=='mlb'&&sport!=='nhl'&&sport!=='f1';let html='<section class="card"><div class="small">'+g.league+' · '+new Date(g.date).toLocaleString('es-MX')+' · '+g.state+'</div><div class="match"><div class="team">'+g.away+'</div><div class="score">'+(g.state==='Próximo'?'VS':g.as+' : '+g.hs)+'</div><div class="team">'+g.home+'</div></div>';
if(view==='consensus'){if(c.avg){html+='<div class="prob"><div><span class="small">Local</span><b>'+c.avg.home.toFixed(1)+'%</b></div>'+(football?'<div><span class="small">Empate</span><b>'+c.avg.draw.toFixed(1)+'%</b></div>':'')+'<div><span class="small">Visitante</span><b>'+c.avg.away.toFixed(1)+'%</b></div></div>'}
html+='<div class="'+(c.agree?'ok':'warn')+'"><b>'+(c.agree?'Consenso: '+outcomeLabel(c.top):'SIN CONSENSO')+'</b></div><p class="small">'+c.reason+'</p>'+c.list.map(p=>'<div class="source">• '+p.source+': Local '+p.home.toFixed(1)+'%'+(football?' · Empate '+p.draw.toFixed(1)+'%':'')+' · Visitante '+p.away.toFixed(1)+'%</div>').join('');if(c.avg)html+='<p class="small">La cifra es el promedio simple de las fuentes disponibles. El porcentaje expresa la probabilidad estimada, no el nivel de certeza del pronóstico.</p>'}
html+='</section>';return html}
function render(){let root=$('app');if(view==='sources'){root.innerHTML='<section class="card"><h3>Conectar proveedores</h3><p class="small">Las claves se guardan en este navegador. No las compartas ni las publiques en GitHub. Sportmonks requiere acceso a su módulo Predictions. The Odds API requiere una clave.</p><label>Sportmonks API token</label><input id="smkey" type="password" placeholder="Pega tu token" value="'+escapeAttr(getKey('smkey'))+'"><label>The Odds API key</label><input id="odkey" type="password" placeholder="Pega tu API key" value="'+escapeAttr(getKey('odkey'))+'"><button id="savekeys">Guardar claves y consultar</button><div class="row"><span>ESPN marcador</span><b class="ok">Sin clave</b></div><div class="row"><span>Sportmonks predictions</span><b>'+(getKey('smkey')?'Clave guardada':'Requiere clave')+'</b></div><div class="row"><span>The Odds API</span><b>'+(getKey('odkey')?'Clave guardada':'Requiere clave')+'</b></div><p class="small">API-Football también ofrece predicciones independientes, pero su endpoint devuelve una selección y métricas comparativas, no porcentajes 1X2 equivalentes. No se mezcla con porcentajes como si fueran la misma métrica.</p></section>';return}
if(sport==='f1'){root.innerHTML='<section class="card"><h3>Fórmula 1 2026</h3>'+(sessions.length?sessions.slice(0,35).map(x=>'<div class="row"><span>'+x.country_name+' · '+x.session_name+'</span><b>'+new Date(x.date_start).toLocaleDateString('es-MX')+'</b></div>').join(''):'<div class="empty">No hay sesiones devueltas por OpenF1.</div>')+'</section>';return}
if(!games.length){root.innerHTML='<div class="card empty">No hay partidos para la fecha consultada.</div>';return}
root.innerHTML=games.map(card).join('')}
function escapeAttr(s){return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;')}
async function json(url){let r=await fetch(url);if(!r.ok)throw Error('HTTP '+r.status);return r.json()}
async function loadScores(){if(sport==='f1'){sessions=await json('https://api.openf1.org/v1/sessions?year=2026');games=[];return}let j=await json('https://site.api.espn.com/apis/site/v2/sports/'+sports[sport][2]+'/scoreboard?limit=100');games=(j.events||[]).map(e=>{let c=e.competitions?.[0],t=c?.competitors||[],h=t.find(x=>x.homeAway==='home')||t[0],a=t.find(x=>x.homeAway==='away')||t[1];if(!h||!a)return null;return{id:e.id,league:sports[sport][0],date:e.date,home:h.team.displayName,away:a.team.displayName,hs:h.score||'0',as:a.score||'0',state:e.status?.type?.completed?'Final':e.status?.type?.state==='in'?'En vivo':'Próximo'}}).filter(Boolean)}
async function loadOdds(){oddsEvents=[];let key=getKey('odkey');if(!key||sport==='f1')return;let k=sports[sport][1];let data=await json('https://api.the-odds-api.com/v4/sports/'+k+'/odds/?apiKey='+encodeURIComponent(key)+'&regions=us&markets=h2h&oddsFormat=decimal');oddsEvents=data||[]}
async function loadSportmonks(){sportmonksFixtures=[];let key=getKey('smkey');if(!key||sport==='f1'||!sports[sport][2].startsWith('soccer/'))return;let date=new Date().toISOString().slice(0,10);let data=await json('https://api.sportmonks.com/v3/football/fixtures/date/'+date+'?api_token='+encodeURIComponent(key)+'&include=participants;predictions.type');sportmonksFixtures=data.data||[]}
async function load(){errors=[];status('Consultando '+sports[sport][0]+'…');try{await loadScores()}catch(e){errors.push('Marcador: '+e.message)}try{await loadOdds()}catch(e){errors.push('Cuotas: '+e.message)}try{await loadSportmonks()}catch(e){errors.push('Sportmonks: '+e.message)}lastUpdate=new Date();$('updated').textContent='Consulta: '+lastUpdate.toLocaleString('es-MX');if(errors.length)status(errors.join(' | '),'warn');else status('Consultas terminadas. Los resultados dependen de las claves y cobertura de cada proveedor.','ok');render()}
$('sports').addEventListener('click',e=>{let b=e.target.closest('[data-s]');if(!b)return;sport=b.dataset.s;nav();load()});$('tabs').addEventListener('click',e=>{let b=e.target.closest('[data-view]');if(!b)return;view=b.dataset.view;document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('active',x===b));render()});$('refresh').onclick=load;document.addEventListener('click',e=>{if(e.target.id==='savekeys'){setKey('smkey',$('smkey').value.trim());setKey('odkey',$('odkey').value.trim());load()}});nav();load();setInterval(()=>{if(document.visibilityState==='visible')load()},120000);
</script></body></html>
