<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090b10"><title>Sports Hub 2026</title>
<style>
:root{color-scheme:dark;--bg:#090b10;--panel:#151b26;--line:#293344;--txt:#f4f7fb;--muted:#9aa6b7;--blue:#4c9aff;--green:#37d69a;--red:#ff6472}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font:15px system-ui,-apple-system,Segoe UI,sans-serif}header{position:sticky;top:0;background:#0d1119f2;backdrop-filter:blur(12px);z-index:2;padding:14px;border-bottom:1px solid var(--line)}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-size:21px;font-weight:850}.blue{color:var(--blue)}button{border:0;border-radius:12px;padding:10px 13px;background:#202a39;color:#dce8f8;font-weight:700}nav,.tabs{display:flex;gap:7px;overflow:auto;padding:12px 0 2px;scrollbar-width:none}nav button,.tabs button{white-space:nowrap;border-radius:20px;font-size:12px;color:var(--muted)}button.active{background:var(--blue);color:white}.tabs{background:#151b26;border-radius:13px;padding:5px}.tabs button{flex:1;background:transparent}.tabs button.active{background:#3a4658}main{max-width:850px;margin:auto;padding:14px}.notice,.card{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:14px;margin:10px 0}.notice{font-size:13px;color:var(--muted)}.ok{color:var(--green)}.err{color:var(--red)}.small{font-size:11px;color:var(--muted)}.match{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;padding:13px 0;border-bottom:1px solid var(--line)}.match:last-child{border:0}.team:last-child{text-align:right}.score{font-size:20px;font-weight:850}.state{text-align:center;color:var(--muted);font-size:11px}.empty{text-align:center;padding:24px;color:var(--muted)}.row{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}a{color:var(--blue)}footer{text-align:center;color:var(--muted);font-size:11px;padding:20px}
</style></head><body>
<header><div class="top"><div><div class="brand">SPORTS HUB <span class="blue">2026</span></div><div class="small">Marcadores · Probabilidades · Mercados</div></div><button id="refresh">↻ Actualizar</button></div><nav id="sports"></nav><div class="tabs" id="tabs"><button data-view="games" class="active">Partidos</button><button data-view="probs">Probabilidades</button><button data-view="smart">Smart Money</button><button data-view="sources">Fuentes</button></div></header>
<main><div id="status" class="notice">Conectando con fuentes públicas…</div><div id="updated" class="small"></div><div id="app"></div></main><footer>Fuentes: ESPN, OpenF1 y proveedor de cuotas cuando esté disponible. Las probabilidades son estimaciones, no garantías. No se inventan splits de dinero ni boletos.</footer>
<script>
const sports={nba:['NBA','basketball/nba'],nfl:['NFL','football/nfl'],mlb:['MLB','baseball/mlb'],nhl:['NHL','hockey/nhl'],mx:['Liga MX','soccer/mex.1'],pl:['Premier','soccer/eng.1'],laliga:['La Liga','soccer/esp.1'],seriea:['Serie A','soccer/ita.1'],bundes:['Bundesliga','soccer/ger.1'],ucl:['Champions','soccer/uefa.champions'],mls:['MLS','soccer/usa.1'],f1:['Fórmula 1',null]};
const oddsKeys={nba:'basketball_nba',nfl:'americanfootball_nfl',mlb:'baseball_mlb',nhl:'icehockey_nhl',mx:'soccer_mexico_ligamx',pl:'soccer_epl',laliga:'soccer_spain_la_liga',seriea:'soccer_italy_serie_a',bundes:'soccer_germany_bundesliga',ucl:'soccer_uefa_champs_league',mls:'soccer_usa_mls'};
let sport='nba',view='games',games=[],sessions=[],odds=[],err='',lastScan=0;
const $=id=>document.getElementById(id);
function status(t,c=''){ $('status').textContent=t;$('status').className='notice '+c}
function drawNav(){ $('sports').innerHTML=Object.entries(sports).map(([k,v])=>'<button data-s="'+k+'" class="'+(sport===k?'active':'')+'">'+v[0]+'</button>').join('')}
function prob(g){let h=.51,a=.49;if(g.homeRec&&g.awayRec){const p=x=>{const m=x.match(/(\d+)-(\d+)/);return m?(+m[1]+1)/(+m[1]+ +m[2]+2):.5};h=Math.max(.12,Math.min(.88,.5+(p(g.homeRec)-p(g.awayRec))*.65));a=1-h}return {h,a}}
function render(){const root=$('app');if(view==='sources'){root.innerHTML='<section class="card"><h3>Fuentes automáticas</h3><div class="row"><span>Marcadores</span><b>ESPN</b></div><div class="row"><span>Fórmula 1</span><b>OpenF1</b></div><div class="row"><span>Cuotas</span><b>Feed público sujeto a disponibilidad</b></div><p class="small">Los porcentajes de boletos y dinero no se muestran sin una fuente verificable. El historial de movimientos comienza cuando se reciben las primeras cuotas.</p></section>';return}
if(view==='smart'){root.innerHTML='<section class="card"><h3>Smart Money y movimientos</h3><p class="small">Esta sección compara precios de cuotas y conserva cambios entre consultas. Las variaciones de cuota no demuestran por sí mismas actividad profesional.</p><div class="row"><span>Eventos con cuotas</span><b>'+odds.length+'</b></div><div class="row"><span>Última consulta</span><b>'+(lastScan?new Date(lastScan).toLocaleString('es-MX'):'Sin consultar')+'</b></div><button id="scan">Consultar cuotas de todas las ligas</button><div id="oddslist"></div></section>';return}
if(sport==='f1'){root.innerHTML='<section class="card"><h3>Calendario F1 2026</h3>'+(sessions.length?sessions.slice(0,30).map(x=>'<div class="row"><span>'+x.country_name+' · '+x.session_name+'</span><b>'+new Date(x.date_start).toLocaleDateString('es-MX')+'</b></div>').join(''):'<div class="empty">Sin sesiones disponibles.</div>')+'</section>';return}
if(!games.length){root.innerHTML='<div class="card empty">No hay partidos disponibles en este marcador para la fecha consultada.</div>';return}
root.innerHTML=games.map(g=>{const p=prob(g);return '<section class="card"><div class="small">'+g.league+' · '+new Date(g.date).toLocaleString('es-MX')+' · '+g.state+'</div><div class="match"><div class="team">'+g.away+'</div><div class="score">'+(g.state==='Próximo'?'VS':g.as+' : '+g.hs)+'</div><div class="team">'+g.home+'</div></div>'+(view==='probs'?'<div class="row"><span>Probabilidad local</span><b>'+Math.round(p.h*100)+'%</b></div><div class="row"><span>Probabilidad visitante</span><b>'+Math.round(p.a*100)+'%</b></div><div class="small">Estimación preliminar basada en récord disponible. No equivale a una cuota de mercado.</div>':'')+'</section>'}).join('')}
async function load(){status('Consultando '+sports[sport][0]+'…');try{if(sport==='f1'){let r=await fetch('https://api.openf1.org/v1/sessions?year=2026');if(!r.ok)throw Error('OpenF1 HTTP '+r.status);sessions=await r.json();games=[]}else{let r=await fetch('https://site.api.espn.com/apis/site/v2/sports/'+sports[sport][1]+'/scoreboard?limit=100');if(!r.ok)throw Error('ESPN HTTP '+r.status);let j=await r.json();games=(j.events||[]).map(e=>{let c=e.competitions?.[0],t=c?.competitors||[],h=t.find(x=>x.homeAway==='home')||t[0],a=t.find(x=>x.homeAway==='away')||t[1];if(!h||!a)return null;return {id:e.id,league:sports[sport][0],date:e.date,home:h.team.displayName,away:a.team.displayName,hs:h.score||'0',as:a.score||'0',homeRec:h.records?.[0]?.summary,awayRec:a.records?.[0]?.summary,state:e.status?.type?.completed?'Final':e.status?.type?.state==='in'?'En vivo':'Próximo'}}).filter(Boolean)}$('updated').textContent='Actualizado: '+new Date().toLocaleString('es-MX');status('Conexión correcta. Fuente: '+(sport==='f1'?'OpenF1':'ESPN')+'.','ok')}catch(e){status('Error de conexión: '+e.message,'err')}render()}
async function scanOdds(){status('Consultando cuotas de todas las ligas…');let all=[],fails=[];for(const [s,k] of Object.entries(oddsKeys)){try{let r=await fetch('https://parlay-api.com/v1/try/'+k+'/odds?markets=h2h,spreads,totals&oddsFormat=american');if(!r.ok)throw Error('HTTP '+r.status);let j=await r.json();all.push(...(Array.isArray(j)?j:(j.data||j.results||[])).map(x=>({...x,_sport:sports[s][0]})))}catch(e){fails.push(sports[s][0]+': '+e.message)}}odds=all;lastScan=Date.now();localStorage.setItem('shOdds',JSON.stringify(odds));localStorage.setItem('shLast',String(lastScan));status('Consulta terminada. '+all.length+' eventos con cuotas. '+(fails.length?'Ligas sin respuesta: '+fails.join(', '):'Todas las ligas respondieron.'),fails.length?'err':'ok');render()}
$('sports').addEventListener('click',e=>{let b=e.target.closest('[data-s]');if(!b)return;sport=b.dataset.s;drawNav();load()});$('tabs').addEventListener('click',e=>{let b=e.target.closest('[data-view]');if(!b)return;view=b.dataset.view;document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('active',x===b));render()});$('refresh').onclick=load;document.addEventListener('click',e=>{if(e.target.id==='scan')scanOdds()});odds=JSON.parse(localStorage.getItem('shOdds')||'[]');lastScan=Number(localStorage.getItem('shLast')||0);drawNav();load();if(!lastScan||Date.now()-lastScan>86400000)scanOdds();setInterval(()=>{if(document.visibilityState==='visible')load()},60000);
</script></body></html>
